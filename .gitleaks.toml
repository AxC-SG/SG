title = "Scout secret scanning"

[extend]
useDefault = true

# Exceptions must be path-and-rule scoped and documented in the pull request.
# Do not suppress a detected secret by value.

[[allowlists]]
description = "SHA-256 checksums of reviewed PNG baselines in the Standard candidate manifest"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^prototype-app/Working Knowledge/AWS/release-evidence/candidate-20261111/source-manifest\.json$''']
regexTarget = "line"
regexes = ['''^\s*"prototype-app/frontend/e2e/visual-baselines/ui2/[^"\r\n]+\.png":\s*"[a-f0-9]{64}",?\s*$''']

[[allowlists]]
description = "Public Auth0 client identifiers in checked-in MCP and frontend documentation"
rules = ["generic-api-key"]
paths = [
  '''^\.mcp\.json$''',
  '''^prototype-app/docs/frontend\.md$'''
]

[[allowlists]]
description = "Synthetic JWT fixtures used only by isolated automated tests"
rules = ["generic-api-key"]
paths = [
  '''^prototype-app/backend/src/test/java/com/prototype/vulnwatch/controller/TenantDeletionPostgresIntegrationTest\.java$''',
  '''^prototype-app/backend/src/test/java/com/prototype/vulnwatch/service/TestPersonaServiceTest\.java$''',
  '''^prototype-app/backend/src/test/java/com/prototype/vulnwatch/controller/CbomEnterpriseGovernancePostgresIntegrationTest\.java$''',
  '''^prototype-app/backend/src/test/java/com/prototype/vulnwatch/controller/BomIngestKeyPostgresIntegrationTest\.java$''',
  '''^prototype-app/frontend/src/features/bom-api/BomApiPanel\.test\.tsx$'''
]

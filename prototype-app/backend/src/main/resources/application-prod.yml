spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:5}
  flyway:
    enabled: ${APP_PLATFORM_MIGRATION_ENABLED:false}
    validate-on-migrate: true
    out-of-order: false
  jpa:
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  # Keep the socket peer intact. The application walks only configured trusted
  # proxy hops; framework rewriting would discard the trust boundary.
  forward-headers-strategy: none
  shutdown: graceful

app:
  environment: ${APP_ENVIRONMENT:production}
  entitlements:
    mode: ${APP_ENTITLEMENTS_MODE:ENFORCE}
    # Deliberate internal cohort selected for qualification. Provision this workspace through
    # the normal release process; this setting does not create it or enroll customer tenants.
    enforce-tenant-allowlist: ${APP_ENTITLEMENTS_ENFORCE_TENANT_ALLOWLIST:slug:scoutgrid-internal-pilot}
  openai:
    enabled: false
  demo:
    # Production emails must point recipients at the public ScoutGrid application.
    # APP_DEMO_APP_BASE_URL may still override this for a separately hosted environment.
    app-base-url: ${APP_DEMO_APP_BASE_URL:https://scoutgrid.io}
  ai-security:
    aws:
      max-concurrent: ${APP_AI_SECURITY_AWS_MAX_CONCURRENT:2}
      admission-timeout-seconds: ${APP_AI_SECURITY_AWS_ADMISSION_TIMEOUT_SECONDS:30}
    jobs:
      enabled: ${APP_AI_SECURITY_JOBS_ENABLED:true}
      poll-interval-ms: ${APP_AI_SECURITY_JOBS_POLL_INTERVAL_MS:3000}
      max-concurrent-per-tenant: ${APP_AI_SECURITY_MAX_CONCURRENT_PER_TENANT:1}
  security:
    require-production-secrets: true
    allow-api-key-auth: false
    default-user-id: ${APP_DEFAULT_USER_ID:}
    validate-rls-runtime-role: true
    local-auth:
      setup-cookie-secure: true
      setup-token-ttl-minutes: ${APP_SETUP_TOKEN_TTL_MINUTES:30}
    public-rate-limit:
      enabled: true
      trust-proxy-headers: true
      # Set only after verifying the actual ingress peers and X-Forwarded-For
      # sanitization. Empty configuration fails startup; no universal CIDRs apply.
      trusted-proxy-cidrs: ${APP_PUBLIC_RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
    turnstile:
      enabled: ${APP_TURNSTILE_ENABLED:true}
      expected-hostname: ${APP_TURNSTILE_EXPECTED_HOSTNAME:scoutgrid.io}
  tenancy:
    allow-header-tenant-selection: false
    require-tenant-context: true
    enforce-schema-version: true
    minimum-compatible-schema-version: 20
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,tenantSchemaReadiness
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level thread=%thread logger=%logger{36} traceId=%X{traceId:-} requestId=%X{requestId:-} tenantId=%X{tenantId:-} actorId=%X{actorId:-} message=%msg%n"

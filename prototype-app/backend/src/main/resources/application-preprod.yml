spring:
  config:
    import: optional:classpath:application-prod.yml

app:
  environment: ${APP_ENVIRONMENT:preproduction}
  security:
    require-production-secrets: true
    allow-api-key-auth: false
    jwt:
      allow-hmac-in-production: true
  tenancy:
    allow-header-tenant-selection: false
    require-tenant-context: true
  entitlements:
    mode: ${APP_ENTITLEMENTS_MODE:ENFORCE}
    enforce-tenant-allowlist: ${APP_ENTITLEMENTS_ENFORCE_TENANT_ALLOWLIST:slug:scoutgrid-internal-pilot}
  openai:
    enabled: false

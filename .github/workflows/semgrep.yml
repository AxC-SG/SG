name: Semgrep SAST

on:
  merge_group:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Semgrep SAST gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Community Edition scanner
        run: python -m pip install 'semgrep==1.182.0'
      - name: Scan Java and TypeScript source
        run: >-
          semgrep scan --config p/ci --metrics=off --disable-version-check
          --error --strict
          --json-output "$RUNNER_TEMP/semgrep.json"
          --sarif-output "$RUNNER_TEMP/semgrep.sarif"
          prototype-app/backend/src/main/java prototype-app/frontend/src
      - name: Retain security scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/semgrep.json
            ${{ runner.temp }}/semgrep.sarif
          if-no-files-found: error
          retention-days: 14

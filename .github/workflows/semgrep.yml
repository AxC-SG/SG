name: Semgrep SAST

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Semgrep SAST gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Community Edition scanner
        run: python -m pip install 'semgrep==1.182.0'
      - name: Scan Java and TypeScript source
        run: >-
          semgrep scan --config p/ci --metrics=off --disable-version-check
          --error --strict
          --json-output "$RUNNER_TEMP/semgrep.json"
          --sarif-output "$RUNNER_TEMP/semgrep.sarif"
          prototype-app/backend/src/main/java prototype-app/frontend/src
      - name: Retain security scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/semgrep.json
            ${{ runner.temp }}/semgrep.sarif
          if-no-files-found: error
          retention-days: 14

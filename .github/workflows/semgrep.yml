name: Semgrep SAST

on:
  merge_group:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Semgrep CE security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Community Edition scanner
        run: python -m pip install 'semgrep==1.182.0'
      - name: Scan Java and TypeScript source
        run: >-
          semgrep scan --config p/ci --metrics=off --disable-version-check
          --error --strict
          --json-output "$RUNNER_TEMP/semgrep.json"
          --sarif-output "$RUNNER_TEMP/semgrep.sarif"
          prototype-app/backend/src/main/java prototype-app/frontend/src
      - name: Retain security scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/semgrep.json
            ${{ runner.temp }}/semgrep.sarif
          if-no-files-found: error
          retention-days: 14

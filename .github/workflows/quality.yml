name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      application: ${{ steps.select.outputs.application }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: select
        run: python3 .github/scripts/classify-changes.py


  ci-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test prototype-app/frontend/e2e/runner.test.mjs
      - run: python3 .github/scripts/test-ci-contracts.py
      - run: python3 .github/scripts/test-maven-reports.py
      - run: python3 -m unittest discover -s prototype-app/scripts/tests -v

  migration-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate migration filenames, ownership, and append-only changes
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/validate-migrations.py

  migration-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prevent migration history rewrites and version collisions
        if: github.event_name != 'push'
        run: python3 .github/scripts/check-migration-integrity.py
      - name: Enforce tenant migration ownership
        run: python3 .github/scripts/check-tenant-ddl.py
      - name: Validate schema migrator environment boundary
        run: sh prototype-app/backend/scripts/test-run-render-migration-env.sh
      - name: Shellcheck schema migrator scripts
        run: shellcheck prototype-app/backend/scripts/run-render-migration.sh prototype-app/backend/scripts/test-run-render-migration-env.sh

  policy-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate legacy example policy packages
        run: node prototype-app/scripts/validate-policy-packages.mjs
      - name: Validate governed AI Grid Phase 1 catalog
        run: node prototype-app/scripts/compile-ai-grid-phase1.mjs
      - name: Validate AI Grid Phase 1 permission contracts
        run: node prototype-app/scripts/validate-ai-grid-phase1-permissions.mjs

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan commit history for secrets
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/run-secret-scan.sh
      - name: Retain redacted secret scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: error
          retention-days: 14

  frontend:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype-app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

      - name: Retain frontend verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.run_id }}
          path: |
            prototype-app/frontend/coverage
          if-no-files-found: warn
          retention-days: 14

  # Fixture-backed user journeys for UI 2. Visual and route/accessibility sweeps run
  # nightly in frontend-e2e-sweep.yml. The image tag must equal the pinned
  # @playwright/test version; check-playwright-image.mjs fails the job otherwise.
  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      E2E_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
      E2E_WORKERS: 2
      E2E_JOURNEY_WORKERS: 2
      E2E_VERSIONS: ui2
    defaults:
      run:
        working-directory: prototype-app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype-app/frontend/package-lock.json
      - run: npm ci
      - run: node e2e/check-playwright-image.mjs
      - run: npm run e2e:build
      - run: npm run e2e:journeys
      - name: Retain e2e results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-${{ github.run_id }}
          path: prototype-app/frontend/e2e/.results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14


  backend:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype-app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -q verify
      - name: Verify migration tests ran in the ordinary suite
        run: python3 ../../.github/scripts/verify-maven-reports.py unit .

      - name: Retain backend verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ github.run_id }}
          path: |
            prototype-app/backend/target/surefire-reports
            prototype-app/backend/target/site/jacoco
            prototype-app/backend/target/spotbugs*
          if-no-files-found: warn
          retention-days: 14

  backend-postgres:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_PLATFORM_OWNER_BOOTSTRAP_ENABLED: "false"
    services:
      postgres:
        image: postgres:16@sha256:d4d4f1579fcfba19c2257326f6a93f4bcf677a430619f084ced704e18eb428ce
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: prototype-app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: >-
          mvn -q -Pci-postgres-it
          -Dpostgres.test.username=postgres
          -Dpostgres.test.password=postgres
          verify
      - name: Verify integration tests executed without skips
        run: python3 ../../.github/scripts/verify-maven-reports.py postgres .

      - name: Retain backend-postgres verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-postgres-${{ github.run_id }}
          path: |
            prototype-app/backend/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Warn if source changed without docs
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.sha }}
          CODE_CHANGED=$(git diff --name-only "$BASE"..."$HEAD" | grep -cE '^prototype-app/(backend|frontend)/src/' || true)
          DOCS_CHANGED=$(git diff --name-only "$BASE"..."$HEAD" | grep -cE '^prototype-app/docs/' || true)
          if [ "$CODE_CHANGED" -gt 0 ] && [ "$DOCS_CHANGED" -eq 0 ]; then
            echo "::warning::Source code changed but no files in prototype-app/docs/ were updated. Check the Documentation section of the PR template."
          fi

  required:
    name: Quality gate
    if: always()
    needs: [changes, ci-contracts, migration-validation, migration-boundaries, policy-packages, secrets, frontend, frontend-e2e, backend, backend-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce all expected results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check-quality-gate.py

name: Quality

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  migration-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate migration filenames, ownership, and append-only changes
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 .github/scripts/validate-migrations.py
      - name: Run migration catalog tests
        working-directory: prototype-app/backend
        run: mvn -q -Dtest=MigrationCatalogTest,PostgresResetMigrationGuardTest test

  migration-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent migration history rewrites and version collisions
        if: github.event_name != 'push'
        run: python3 .github/scripts/check-migration-integrity.py
      - name: Enforce tenant migration ownership
        run: python3 .github/scripts/check-tenant-ddl.py
      - name: Validate schema migrator environment boundary
        run: sh prototype-app/backend/scripts/test-run-render-migration-env.sh
      - name: Shellcheck schema migrator scripts
        run: shellcheck prototype-app/backend/scripts/run-render-migration.sh prototype-app/backend/scripts/test-run-render-migration-env.sh

  policy-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate legacy example policy packages
        run: node prototype-app/scripts/validate-policy-packages.mjs
      - name: Validate governed AI Grid Phase 1 catalog
        run: node prototype-app/scripts/compile-ai-grid-phase1.mjs
      - name: Validate AI Grid Phase 1 permission contracts
        run: node prototype-app/scripts/validate-ai-grid-phase1-permissions.mjs

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan commit history for secrets
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/run-secret-scan.sh
      - name: Retain redacted secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototype-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -q verify

  backend-postgres:
    runs-on: ubuntu-latest
    env:
      APP_PLATFORM_OWNER_BOOTSTRAP_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: prototype-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: >-
          mvn -q -Ppostgres-it
          -Dpostgres.test.username=postgres
          -Dpostgres.test.password=postgres
          verify

  docs-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn if source changed without docs
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.sha }}
          CODE_CHANGED=$(git diff --name-only "$BASE"..."$HEAD" | grep -cE '^prototype-app/(backend|frontend)/src/' || true)
          DOCS_CHANGED=$(git diff --name-only "$BASE"..."$HEAD" | grep -cE '^prototype-app/docs/' || true)
          if [ "$CODE_CHANGED" -gt 0 ] && [ "$DOCS_CHANGED" -eq 0 ]; then
            echo "::warning::Source code changed but no files in prototype-app/docs/ were updated. Check the Documentation section of the PR template."
          fi

  images:
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - backend-postgres
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f prototype-app/backend/Dockerfile -t vulnwatch-backend:${{ github.sha }} prototype-app/backend
      - name: Build frontend image
        run: docker build -f prototype-app/frontend/Dockerfile.ci -t vulnwatch-frontend:${{ github.sha }} prototype-app/frontend

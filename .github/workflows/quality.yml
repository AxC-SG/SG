name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      backend: ${{ steps.select.outputs.backend }}
      infrastructure: ${{ steps.select.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: select
        run: python3 .github/scripts/classify-changes.py


  # Quick repository checks that need no build: CI tooling, migrations, the
  # migrator boundary and governed policy content. Each check is its own step.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test the browser journey runner
        run: node --test prototype-app/frontend/e2e/runner.test.mjs
      - name: Test CI scripts
        run: |
          python3 .github/scripts/test-ci-contracts.py
          python3 .github/scripts/test-maven-reports.py
          python3 .github/scripts/test-aws-backend-archive.py
          python3 .github/scripts/test-check-migrations.py
          python3 -m unittest discover -s prototype-app/scripts/tests -v
      - name: Check migration files and append-only history
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check-migrations.py
      - name: Enforce tenant migration ownership
        run: python3 .github/scripts/check-tenant-ddl.py
      - name: Validate schema migrator environment boundary
        run: sh prototype-app/backend/scripts/test-run-schema-migration-env.sh
      - name: Shellcheck schema migrator scripts
        run: shellcheck prototype-app/backend/scripts/run-schema-migration.sh prototype-app/backend/scripts/test-run-schema-migration-env.sh
      - name: Validate legacy example policy packages
        run: node prototype-app/scripts/validate-policy-packages.mjs
      - name: Validate governed AI Grid Phase 1 catalog
        run: node prototype-app/scripts/compile-ai-grid-phase1.mjs
      - name: Validate AI Grid Phase 1 permission contracts
        run: node prototype-app/scripts/validate-ai-grid-phase1-permissions.mjs

  terraform:
    name: Offline Terraform validation
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install verified Terraform CLI
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-cli"
          curl --fail --silent --show-error --location \
            https://releases.hashicorp.com/terraform/1.13.5/terraform_1.13.5_linux_amd64.zip \
            --output "$RUNNER_TEMP/terraform.zip"
          echo "0dbe3fcc268eb670801af6a6456799d1ae26e72e73797f6c6167e18aafd1fd9a  $RUNNER_TEMP/terraform.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/terraform-cli"
          echo "$RUNNER_TEMP/terraform-cli" >> "$GITHUB_PATH"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive prototype-app/infrastructure/terraform
      - name: Validate and test the Standard configuration without a backend
        working-directory: prototype-app/infrastructure/terraform/standard
        run: |
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate -no-color
          terraform test -no-color
      - name: Validate and test network routing with the same provider lock
        working-directory: prototype-app/infrastructure/terraform/modules/standard-network
        run: |
          cp ../../standard/.terraform.lock.hcl .terraform.lock.hcl
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate -no-color
          terraform test -no-color
      - name: Check and test the lab cycle scripts offline
        working-directory: prototype-app/infrastructure/lab
        run: |
          shellcheck scripts/*.sh scripts/tests/*.sh
          bash scripts/tests/lab.test.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify SQL checksum secret-scan controls
        run: python3 .github/scripts/test-gitleaks-checksums.py --scanner "$RUNNER_TEMP/gitleaks"

      - name: Scan commit history for secrets
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/run-secret-scan.sh
      - name: Retain redacted secret scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: error
          retention-days: 14

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype-app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

      - name: Archive the paired frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
          QUALITY_RUN: ${{ github.run_id }}
        run: |
          mkdir -p candidate
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > candidate/files.sha256
          tar -czf candidate/frontend.tar.gz -C dist .
          archive_sha=$(sha256sum candidate/frontend.tar.gz | cut -d ' ' -f 1)
          jq -n --arg sha "$SOURCE_SHA" --arg run "$QUALITY_RUN" --arg digest "$archive_sha" \
            '{source_sha: $sha, quality_run: $run, archive_sha256: $digest,
              build_profile: "CI defaults; live lab configuration requires a separately recorded build"}' \
            > candidate/manifest.json

      - name: Retain the paired frontend candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-frontend-candidate-${{ github.run_id }}
          path: prototype-app/frontend/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Retain frontend verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.run_id }}
          path: |
            prototype-app/frontend/coverage
          if-no-files-found: warn
          retention-days: 14

  # Fixture-backed user journeys for UI 2. Visual and route/accessibility sweeps run
  # nightly in frontend-e2e-sweep.yml. The image tag must equal the pinned
  # @playwright/test version; check-playwright-image.mjs fails the job otherwise.
  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    env:
      E2E_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble
      E2E_WORKERS: 2
      E2E_JOURNEY_WORKERS: 2
      E2E_VERSIONS: ui2
    defaults:
      run:
        working-directory: prototype-app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype-app/frontend/package-lock.json
      - run: npm ci
      - run: node e2e/check-playwright-image.mjs
      - run: npm run e2e:build
      - run: npm run e2e:journeys
      - name: Retain e2e results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-${{ github.run_id }}
          path: prototype-app/frontend/e2e/.results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14


  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype-app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -q verify
      - name: Verify migration tests ran in the ordinary suite
        run: python3 ../../.github/scripts/verify-maven-reports.py unit .

      - name: Retain backend verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ github.run_id }}
          path: |
            prototype-app/backend/target/surefire-reports
            prototype-app/backend/target/site/jacoco
            prototype-app/backend/target/spotbugs*
          if-no-files-found: warn
          retention-days: 14

  backend-postgres:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_PLATFORM_OWNER_BOOTSTRAP_ENABLED: "false"
    services:
      postgres:
        image: postgres:16@sha256:d4d4f1579fcfba19c2257326f6a93f4bcf677a430619f084ced704e18eb428ce
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: prototype-app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: >-
          mvn -q -Pci-postgres-it
          -Dpostgres.test.username=postgres
          -Dpostgres.test.password=postgres
          verify
      - name: Verify integration tests executed without skips
        run: python3 ../../.github/scripts/verify-maven-reports.py postgres .

      - name: Retain backend-postgres verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-postgres-${{ github.run_id }}
          path: |
            prototype-app/backend/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Quality gate
    if: always()
    needs: [changes, static, secrets, terraform, frontend, frontend-e2e, backend, backend-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce all expected results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check-quality-gate.py

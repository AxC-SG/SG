name: Performance Governance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_demo_data:
        description: Seed demo advisory data before certification
        required: false
        default: "false"
      baseline_iterations:
        description: Number of route-sampling iterations for the baseline phase
        required: false
        default: "3"
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      performance: ${{ steps.select.outputs.performance }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: select
        run: python3 .github/scripts/classify-changes.py

  certify:
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:d4d4f1579fcfba19c2257326f6a93f4bcf677a430619f084ced704e18eb428ce
        env:
          POSTGRES_DB: vulnwatch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vulnwatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: prototype-app
    env:
      BASE_URL: http://127.0.0.1:8080
      API_KEY: change-me-in-prod
      CREATOR_KEY: local-creator
      APP_API_KEY: change-me-in-prod
      APP_CREATOR_KEY: local-creator
      APP_ALLOW_API_KEY_AUTH: "true"
      APP_REQUIRE_TENANT_CONTEXT: "false"
      DB_URL: jdbc:postgresql://127.0.0.1:5432/vulnwatch
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RUNTIME_DB_USERNAME: scout_runtime
      RUNTIME_DB_PASSWORD: postgres-runtime
      APP_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      START_BACKEND: "true"
      SPRING_PROFILES_ACTIVE: local
      APP_ENVIRONMENT: test
      APP_RUNTIME_ROLE: all
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      SEED_DEMO_DATA: ${{ github.event_name == 'workflow_dispatch' && (inputs.seed_demo_data || 'false') || 'false' }}
      BASELINE_ITERATIONS: ${{ inputs.baseline_iterations || '3' }}
      CERTIFICATION_STRICT: "true"
      FAIL_ON_NONCOMPLIANT: "true"
      FAIL_ON_AUTH_SKIPS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run performance governance certification
        env:
          OUT_DIR: ${{ runner.temp }}/performance-governance
        run: sh ./scripts/run-performance-governance.sh

      - name: Upload performance governance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-governance-${{ github.run_id }}
          path: ${{ runner.temp }}/performance-governance
          retention-days: 14

  required:
    name: Performance gate
    if: always()
    needs: [changes, certify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce expected certification result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          APPLICABLE: ${{ needs.changes.outputs.performance }}
          CERTIFICATION_RESULT: ${{ needs.certify.result }}
        run: |
          test "$SELECTION_RESULT" = success
          if [ "$APPLICABLE" = true ]; then
            test "$CERTIFICATION_RESULT" = success
          elif [ "$APPLICABLE" = false ]; then
            test "$CERTIFICATION_RESULT" = skipped
            echo 'Performance certification is not applicable to these changes.'
          else
            echo 'Missing performance selection' >&2
            exit 1
          fi

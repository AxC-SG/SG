name: Trivy Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

permissions:
  contents: read
  actions: read  # SARIF upload reads the current workflow run.
  security-events: write  # Required to upload SARIF to GitHub Security tab

jobs:
  filesystem:
    name: Filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Spring advisory applicability
        run: |
          python3 .github/scripts/test-spring-advisory-applicability.py
          python3 .github/scripts/check-spring-advisory-applicability.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve backend dependencies
        working-directory: prototype-app/backend
        run: mvn -q -DskipTests dependency:go-offline

      - name: Run Trivy on filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          scanners: vuln
          severity: CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: '0'

      - name: Upload filesystem scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Enforce filesystem vulnerability gate
        run: trivy fs --scanners vuln --severity CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 .

  images:
    name: Docker image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Spring advisory applicability
        run: |
          python3 .github/scripts/test-spring-advisory-applicability.py
          python3 .github/scripts/check-spring-advisory-applicability.py

      - name: Build backend image
        run: docker build -f prototype-app/backend/Dockerfile -t vulnwatch-backend:${{ github.sha }} prototype-app/backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: vulnwatch-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          trivyignores: .trivyignore.yaml
          scanners: vuln
          severity: CRITICAL
          exit-code: '0'

      - name: Upload backend image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image

      - name: Build frontend image
        run: docker build -f prototype-app/frontend/Dockerfile.ci -t vulnwatch-frontend:${{ github.sha }} prototype-app/frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: vulnwatch-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          trivyignores: .trivyignore.yaml
          scanners: vuln
          severity: CRITICAL
          exit-code: '0'

      - name: Upload frontend image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-image

      - name: Enforce image vulnerability gate
        run: |
          trivy image --scanners vuln --severity CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 vulnwatch-backend:${{ github.sha }}
          trivy image --scanners vuln --severity CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 vulnwatch-frontend:${{ github.sha }}

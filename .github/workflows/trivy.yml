name: Trivy Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  filesystem:
    name: Trivy filesystem gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Spring advisory applicability
        run: |
          python3 .github/scripts/test-spring-advisory-applicability.py
          python3 .github/scripts/check-spring-advisory-applicability.py

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve backend dependencies
        working-directory: prototype-app/backend
        run: mvn -q -DskipTests dependency:go-offline

      - name: Run Trivy on filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          scanners: vuln
          severity: CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: '0'

      - name: Enforce filesystem vulnerability gate
        run: trivy fs --scanners vuln --severity CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 .

      - name: Retain filesystem scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-filesystem-${{ github.run_id }}
          path: trivy-fs.sarif
          if-no-files-found: error
          retention-days: 14

  images:
    name: Trivy images gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Spring advisory applicability
        run: |
          python3 .github/scripts/test-spring-advisory-applicability.py
          python3 .github/scripts/check-spring-advisory-applicability.py

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: prototype-app/backend
          file: prototype-app/backend/Dockerfile
          load: true
          push: false
          tags: vulnwatch-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: vulnwatch-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          trivyignores: .trivyignore.yaml
          scanners: vuln
          severity: CRITICAL
          exit-code: '0'

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: prototype-app/frontend
          file: prototype-app/frontend/Dockerfile.ci
          load: true
          push: false
          tags: vulnwatch-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Record scanned image identities
        run: docker image inspect vulnwatch-backend:${{ github.sha }} vulnwatch-frontend:${{ github.sha }} --format '{{json .}}' > image-identities.jsonl

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: vulnwatch-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          trivyignores: .trivyignore.yaml
          scanners: vuln
          severity: CRITICAL
          exit-code: '0'

      - name: Enforce image vulnerability gate
        run: |
          trivy image --scanners vuln --severity CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 vulnwatch-backend:${{ github.sha }}
          trivy image --scanners vuln --severity CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 vulnwatch-frontend:${{ github.sha }}

      - name: Retain image scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-images-${{ github.run_id }}
          path: |
            image-identities.jsonl
            trivy-backend.sarif
            trivy-frontend.sarif
          if-no-files-found: error
          retention-days: 14

name: Publish AWS backend candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Trivy workflow run ID for the reviewed main commit
        required: true
        type: string
      target:
        description: Protected GitHub deployment environment
        required: true
        type: choice
        options:
          - lab
          - production
  # Publishes each qualified main commit to the lab ECR before its 14-day image
  # archive expires. Publication only: nothing here changes what ECS runs.
  # PR D must keep these names in step with the workflows it renames.
  workflow_run:
    workflows: [Quality, Semgrep SAST, Trivy Security Scan, Performance Governance]
    types: [completed]
    branches: [main]

permissions: {}

# One publication per target at a time. A newer trigger replaces a queued one,
# and the selector skips commits that are superseded or already published.
concurrency:
  group: aws-publish-${{ inputs.target || 'lab' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  qualify:
    name: Verify candidate run and source checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.select.outputs.publish }}
      target: ${{ steps.select.outputs.target }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      candidate_run: ${{ steps.select.outputs.candidate_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select a candidate whose exact commit passed every required check
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: python3 .github/scripts/select-aws-candidate.py

  publish:
    name: Publish verified candidate to ECR
    needs: qualify
    if: needs.qualify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws-standard-${{ needs.qualify.outputs.target }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the reviewed image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.qualify.outputs.candidate_run }}
          name: aws-backend-candidate-${{ needs.qualify.outputs.candidate_run }}
          path: candidate

      - name: Verify the archive and load the scanned image
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          CANDIDATE_RUN: ${{ needs.qualify.outputs.candidate_run }}
        run: |
          jq -e --arg sha "$SOURCE_SHA" --arg run "$CANDIDATE_RUN" --arg region "$AWS_REGION" '
            .source_sha == $sha and .candidate_run == $run and .platform == "linux/amd64" and
            (.rds_ca_sha256_by_region[$region] | test("^[a-f0-9]{64}$"))' \
            candidate/manifest.json >/dev/null
          python3 .github/scripts/verify-aws-backend-archive.py candidate/image.tar.gz candidate/manifest.json --source-sha "$SOURCE_SHA"
          docker image load --input candidate/image.tar.gz
          python3 .github/scripts/verify-aws-backend-archive.py candidate/image.tar.gz candidate/manifest.json --source-sha "$SOURCE_SHA" --loaded-image > candidate/verified-identity.json

      - name: Verify the publication target
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          TARGET: ${{ needs.qualify.outputs.target }}
        run: |
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$TARGET" == lab || "$TARGET" == production ]]
          [[ "$AWS_REGION" == us-east-1 || "$AWS_REGION" == ap-southeast-2 ]]
          test "$ROLE_ARN" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/scoutgrid-$TARGET-github-ecr-publish"

      - name: Assume the scoped ECR publisher role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: scoutgrid-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900

      - name: Publish and record the immutable ECR digest
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          TARGET: ${{ needs.qualify.outputs.target }}
        run: |
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          repository="scoutgrid-$TARGET-backend"
          tag="$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="$registry/$repository:$tag"
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker image tag "scoutgrid-aws-backend:$SOURCE_SHA" "$image"
          docker image push "$image"
          digest=$(aws ecr batch-get-image --repository-name "$repository" --image-ids "imageTag=$tag" \
            --query 'images[0].imageId.imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq --arg uri "$registry/$repository@$digest" --arg digest "$digest" --arg target "$TARGET" --arg region "$AWS_REGION" \
            '. + {ecr_image: $uri, image_digest: $digest, target: $target, aws_region: $region}' \
            candidate/manifest.json > aws-publication.json
          printf 'Published %s@%s\n' "$registry/$repository" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the publication record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-publication-${{ needs.qualify.outputs.target }}-${{ needs.qualify.outputs.source_sha }}
          path: aws-publication.json
          if-no-files-found: error
          retention-days: 90

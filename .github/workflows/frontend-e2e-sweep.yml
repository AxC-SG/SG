name: Frontend E2E Sweep

# Full UI 2 route sweep and axe comparison at 390/768/1280/1440px in both themes,
# plus visual screenshot comparison (removed from PR CI to keep it fast).
# Kept out of quality.yml so the schedule does not re-run the other quality jobs.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      E2E_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
      E2E_VERSIONS: ui2
    defaults:
      run:
        working-directory: prototype-app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype-app/frontend/package-lock.json
      - run: npm ci
      - run: node e2e/check-playwright-image.mjs
      - run: npm run e2e:build
      - run: npm run e2e:sweep -- --widths 390,768,1280,1440
      - name: Visual screenshot comparison
        if: ${{ !cancelled() }}
        run: npm run e2e:visual
      - name: Retain sweep results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-sweep-${{ github.run_id }}
          path: prototype-app/frontend/e2e/.results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

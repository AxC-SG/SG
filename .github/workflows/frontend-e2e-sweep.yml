name: Frontend E2E Sweep

# Full UI 2 route sweep and axe comparison at 390/768/1280/1440px in both themes.
# Kept out of quality.yml so the schedule does not re-run the other quality jobs.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      E2E_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
      E2E_VERSIONS: ui2
    defaults:
      run:
        working-directory: prototype-app/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype-app/frontend/package-lock.json
      - run: npm ci
      - run: node e2e/check-playwright-image.mjs
      - run: npm run e2e:build
      - run: npm run e2e:sweep -- --widths 390,768,1280,1440
      - name: Retain sweep results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-e2e-sweep-${{ github.run_id }}
          path: prototype-app/frontend/e2e/.results
          if-no-files-found: warn
          retention-days: 14

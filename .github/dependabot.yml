version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/prototype-app/backend, /prototype-app/frontend]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /prototype-app/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

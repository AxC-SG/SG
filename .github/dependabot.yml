version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/prototype-app/backend, /prototype-app/frontend]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /prototype-app/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: maven
    directory: /prototype-app/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: terraform
    directories:
      - /prototype-app/infrastructure/terraform/standard
      - /prototype-app/infrastructure/terraform/modules/standard-network
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        update-types: [minor, patch]

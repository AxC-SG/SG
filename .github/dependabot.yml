version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /prototype-app/backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /prototype-app/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript below 6.1, and TypeScript 7 ships
      # only the native compiler without the JavaScript API it needs. Remove
      # this once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
  - package-ecosystem: maven
    directory: /prototype-app/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: terraform
    directories:
      - /prototype-app/infrastructure/terraform/standard
      - /prototype-app/infrastructure/terraform/modules/standard-network
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        update-types: [minor, patch]

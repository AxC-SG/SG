# Render hosts the pre-production backend only. The public React SPA is deployed
# exclusively by Vercel from prototype-app/frontend/vercel.json; do not add a
# frontend service here.
services:
  - type: web
    name: scout-backend
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./prototype-app/backend
    dockerfilePath: ./prototype-app/backend/Dockerfile
    autoDeploy: false
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: preprod
      - key: SERVER_PORT
        value: "10000"
      - key: APP_ENVIRONMENT
        value: preproduction
      - key: APP_RUNTIME_ROLE
        value: all
      # Qualify the actual Render ingress peer ranges and forwarded chain before
      # supplying this value. Do not substitute all private networks or 0.0.0.0/0.
      - key: APP_PUBLIC_RATE_LIMIT_TRUSTED_PROXY_CIDRS
        sync: false
      # Supply only the restricted runtime role to the permanent web service.
      # The owner/migration connection is used by an approved one-off migration
      # operation and must never be stored in this service environment.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_SCHEMA_MIGRATION_ENABLED
        value: "false"
      - key: APP_SCHEMA_MIGRATION_REPORT_ONLY
        value: "false"
      - key: APP_JWT_HMAC_SECRET
        generateValue: true
      - key: APP_ALLOW_HMAC_IN_PRODUCTION
        value: "true"
      - key: APP_CREDENTIAL_ENCRYPTION_KEY
        # This key encrypts persisted connector credentials. Configure one durable,
        # base64-encoded 32-byte value in Render and reuse it for every one-off
        # migration service; regenerating it makes existing credentials unreadable.
        sync: false
      - key: APP_JWT_ISSUER_URI
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://scoutgrid.io
      - key: APP_DEMO_SYNCHRONOUS_TENANT_PROVISIONING_ENABLED
        value: "false"
      - key: APP_TURNSTILE_ENABLED
        value: "true"
      - key: APP_TURNSTILE_SECRET_KEY
        sync: false
      - key: APP_TURNSTILE_EXPECTED_HOSTNAME
        value: scoutgrid.io
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Scout.ai <noreply@scoutgrid.io>"
      - key: RESEND_FROM_DOMAIN
        value: scoutgrid.io
      - key: APP_DEMO_APP_BASE_URL
        value: https://scoutgrid.io
      - key: APP_TEST_PERSONAS_ENABLED
        value: "false"
      - key: APP_ALLOW_API_KEY_AUTH
        value: "false"
      - key: APP_ALLOW_HEADER_TENANT_SELECTION
        value: "false"
      - key: APP_REQUIRE_TENANT_CONTEXT
        value: "true"
      # Direct membership for the internal playground only. The backend resolves
      # this identity through the platform user registry and never applies it to
      # customer tenants.
      - key: APP_PLAYGROUND_MEMBERSHIPS_ENABLED
        value: "true"
      - key: APP_PLAYGROUND_MEMBERSHIP_SUBJECTS
        value: scoutgrid.io@gmail.com
      - key: APP_PLAYGROUND_MEMBERSHIP_ROLE
        value: TENANT_ADMIN
